{% extends 'layout.html' %}
{% block title %}Login page{% endblock %}
{% block body %}
    <nav class="navbar bg-white border-bottom px-3">
    <a class="navbar-brand" href="{% url 'feed' %}">PhotoShare</a>
    <p class="navbar-brand ">Welcome to the PhotoShare</p>
</nav>
    <div class="auth-card">
    <form action="{% url 'login' %}" method="post">
    {% csrf_token %}
        {{ form.non_field_errors }}

        <p>Username: {{ form.email }}</p>



        <p>Password: {{ form.password }}</p>


        <input type="submit" value="login" class="btn btn-brand">
        <br>
        Don't have an account? <a href="{% url 'register' %}">Register here.</a>
    </form>
    </div>



{% endblock %}
